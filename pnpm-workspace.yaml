# pnpm 12 refuses a dependency's install script unless it is listed here.
# esbuild and workerd (via wrangler) download their platform binaries; Astryx's
# scripts only print an "astryx init" hint; core-js (via posthog-js) only prints a banner.
allowBuilds:
  '@astryxdesign/cli': false
  '@astryxdesign/core': false
  core-js: false
  esbuild: true
  workerd: true

# Our own BotPixel packages are trusted the day they are published.
minimumReleaseAgeExclude:
  - '@botharness/pixel-avatar@0.1.0'
  - '@botharness/pixel-morph@0.1.0 || 0.2.0'
  - '@botharness/pixel-banner@0.1.0'
